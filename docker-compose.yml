version: '3.9'

services:
  # ─── PostgreSQL Database ─────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: library_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./library_backend
      dockerfile: Dockerfile
    container_name: library_backend
    restart: unless-stopped
    env_file:
      - ./library_backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./library_backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py makemigrations users books transactions &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn library_backend.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # ─── Next.js Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./library_frontend
      dockerfile: Dockerfile
    container_name: library_frontend
    restart: unless-stopped
    env_file:
      - ./library_frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
